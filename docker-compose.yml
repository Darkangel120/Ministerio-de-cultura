services:
  db:
    image: postgres:16
    container_name: mincultura-db
    environment:
      POSTGRES_DB: mincultura
      POSTGRES_USER: mincultura
      POSTGRES_PASSWORD: mincultura
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mincultura"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: